<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">    <title>UrbanWeave | Find Your Route</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />

    <style>

        @media (max-width: 768px) {

            #route-details {
                top: auto !important;
                bottom: 5.5rem !important;
                right: auto !important;
                left: 50% !important;
                transform: translateX(-50%) !important;
                width: 92% !important;
                max-width: 24rem !important;
            }

            #search-card.top-5 {
                top: 4.5rem !important;
            }
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #1a1b26 inset !important;
            -webkit-text-fill-color: white !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        body { margin: 0; padding: 0; background-color: #1a1b26; color: #a9b1d6; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 0; }
        .glass-panel { background: rgba(26, 27, 38, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(122, 162, 247, 0.2); }
        .neon-text { text-shadow: 0 0 10px rgba(122, 162, 247, 0.7); }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #292e42; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #7aa2f7; }

        .neon-dot-green {
            background-color: #9ece6a;
            box-shadow: 0 0 8px rgba(158, 206, 106, 0.3);
            transition: all 0.3s ease;
        }
        .neon-dot-pink {
            background-color: #f7768e;
            box-shadow: 0 0 8px rgba(247, 118, 142, 0.3);
            transition: all 0.3s ease;
        }

        .glow-active-green {
            animation: pulse-green 1.5s infinite alternate;
        }
        .glow-active-pink {
            animation: pulse-pink 1.5s infinite alternate;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 5px #9ece6a, 0 0 10px #9ece6a; transform: scale(1); }
            100% { box-shadow: 0 0 10px #9ece6a, 0 0 20px #9ece6a, 0 0 35px #9ece6a; transform: scale(1.2); }
        }
        @keyframes pulse-pink {
            0% { box-shadow: 0 0 5px #f7768e, 0 0 10px #f7768e; transform: scale(1); }
            100% { box-shadow: 0 0 10px #f7768e, 0 0 20px #f7768e, 0 0 35px #f7768e; transform: scale(1.2); }
        }
    </style>
</head>

<body class="overflow-hidden flex flex-col h-screen relative">

    <div id="map"></div>

    <button id="menu-btn" class="absolute top-5 left-5 z-20 glass-panel p-3 rounded-full text-white hover:text-[#7aa2f7] hover:scale-110 transition-all shadow-lg">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
    </button>

    <div id="sidebar" class="absolute top-0 left-0 h-full w-64 glass-panel z-30 transform -translate-x-full transition-transform duration-500 ease-in-out border-r border-[#292e42] flex flex-col shadow-[20px_0_40px_rgba(0,0,0,0.5)] bg-[#1a1b26]/95">
        <div class="flex justify-between items-center p-6 border-b border-[#292e42]">
            <h2 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-[#7aa2f7] to-[#bb9af7]">Menu</h2>
            <button id="close-sidebar-btn" class="text-gray-400 hover:text-[#f7768e] transition-colors p-1">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <div class="flex flex-col flex-grow p-4 space-y-3 mt-4">
            <button class="flex items-center space-x-3 w-full p-3 rounded-xl hover:bg-[#24283b] text-gray-200 hover:text-[#7aa2f7] transition-all text-left group">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 group-hover:scale-110 transition-transform"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" /></svg>
                <span class="font-medium text-md tracking-wide">Home</span>
            </button>
            <button class="flex items-center space-x-3 w-full p-3 rounded-xl hover:bg-[#24283b] text-gray-200 hover:text-[#9ece6a] transition-all text-left group">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 group-hover:scale-110 transition-transform"><path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" /></svg>
                <span class="font-medium text-md tracking-wide">About Us</span>
            </button>
            <button class="flex items-center space-x-3 w-full p-3 rounded-xl hover:bg-[#24283b] text-gray-200 hover:text-[#f7768e] transition-all text-left group">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 group-hover:scale-110 transition-transform"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                <span class="font-medium text-md tracking-wide">Report Bugs</span>
            </button>
        </div>
        <div class="p-6 text-xs text-gray-500 text-center border-t border-[#292e42] tracking-wider">
            &copy; 2026 UrbanWeave
        </div>
    </div>

    <div id="search-card" class="z-10 absolute top-1/3 left-1/2 transform -translate-x-1/2 origin-top w-11/12 max-w-md glass-panel p-8 rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.5)] transition-all duration-700 border border-[#292e42]">

        <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-[#7aa2f7] to-[#bb9af7] mb-6 text-center drop-shadow-lg tracking-wide">
            UrbanWeave

        </h1>

        <div class="w-full">
            <div class="relative flex flex-col gap-4 mb-4">

                <div class="absolute left-[21px] top-[27px] bottom-[27px] w-[2px] neon-line z-0"></div>

                <div class="relative z-50">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none z-[60]">
                        <div id="from-dot" class="w-3 h-3 rounded-full neon-dot-green"></div>
                    </div>

                    <input type="text" id="from-input" placeholder="Current Location (e.g., Pari Chowk)"
                        class="w-full bg-[#1a1b26]/80 text-gray-100 placeholder-gray-500 border border-[#292e42] rounded-xl py-4 pl-12 pr-12 focus:outline-none focus:border-[#9ece6a] focus:ring-1 focus:ring-[#9ece6a] transition-all text-sm font-medium backdrop-blur-md" autocomplete="off">

                    <button id="locate-me-btn" class="absolute right-3 top-1/2 transform -translate-y-1/2 z-[60] text-gray-500 hover:text-[#7aa2f7] transition-colors p-2 cursor-pointer" title="Locate Me">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
                        </svg>
                    </button>

                    <ul id="from-suggestions" class="absolute left-0 right-0 top-full mt-2 bg-[#1a1b26]/95 backdrop-blur-md border border-[#292e42] rounded-xl shadow-[0_10px_30px_rgba(0,0,0,0.8)] max-h-48 overflow-y-auto hidden z-[100] divide-y divide-[#292e42] custom-scrollbar"></ul>
                </div>

                <div class="relative z-40">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none z-[60]">
                        <div id="to-dot" class="w-3 h-3 rounded-full neon-dot-pink"></div>
                    </div>

                    <input type="text" id="to-input" placeholder="Where to? (e.g., Sharda Uni)"
                        class="w-full bg-[#1a1b26]/80 text-gray-100 placeholder-gray-500 border border-[#292e42] rounded-xl py-4 pl-12 pr-4 focus:outline-none focus:border-[#f7768e] focus:ring-1 focus:ring-[#f7768e] transition-all text-sm font-medium backdrop-blur-md" autocomplete="off">

                    <ul id="to-suggestions" class="absolute left-0 right-0 top-full mt-2 bg-[#1a1b26]/95 backdrop-blur-md border border-[#292e42] rounded-xl shadow-[0_10px_30px_rgba(0,0,0,0.8)] max-h-48 overflow-y-auto hidden z-[100] divide-y divide-[#292e42] custom-scrollbar"></ul>
                </div>
            </div>

            <button id="weave-btn" class="w-full bg-gradient-to-r from-[#7aa2f7] to-[#bb9af7] text-[#1a1b26] font-extrabold py-4 rounded-xl hover:opacity-90 hover:scale-[1.02] active:scale-95 transition-all shadow-[0_0_20px_rgba(187,154,247,0.3)] tracking-wider uppercase text-sm">
                Find My Weave
            </button>

            <div id="route-options" class="hidden mt-4 pt-4 border-t border-[#292e42]/50 transition-opacity duration-700 opacity-0">
                <span class="block text-[10px] text-gray-400 uppercase tracking-widest text-center mb-3">Select Route Preference</span>
                <div class="grid grid-cols-3 gap-2">
                    <button id="btn-fastest" class="route-type-btn glass-panel p-2 rounded-xl text-center border-t-2 border-[#7aa2f7] hover:bg-[#24283b] hover:shadow-[0_0_15px_rgba(122,162,247,0.2)] text-gray-200 transition-all text-xs font-bold">Fastest</button>
                    <button id="btn-cheapest" class="route-type-btn glass-panel p-2 rounded-xl text-center border-t-2 border-[#9ece6a] hover:bg-[#24283b] hover:shadow-[0_0_15px_rgba(158,206,106,0.2)] text-gray-200 transition-all text-xs font-bold">Cheapest</button>
                    <button id="btn-safest" class="route-type-btn glass-panel p-2 rounded-xl text-center border-t-2 border-[#e0af68] hover:bg-[#24283b] hover:shadow-[0_0_15px_rgba(224,175,104,0.2)] text-[#e0af68] transition-all text-xs font-bold">Safest</button>
                </div>
            </div>
        </div>
    </div>

    <div id="route-details" class="z-10 absolute top-5 right-5 w-80 glass-panel p-6 rounded-2xl hidden flex-col gap-3 shadow-2xl">
        <h2 id="detail-title" class="text-2xl font-bold text-white mb-2">Route Details</h2>
        <div class="flex justify-between items-center border-b border-gray-600 pb-2">
            <span class="text-gray-400">Est. Time</span>
            <span id="detail-time" class="text-xl font-bold text-white">--</span>
        </div>
        <div class="flex justify-between items-center border-b border-gray-600 pb-2">
            <span class="text-gray-400">Cost</span>
            <span id="detail-cost" class="text-xl font-bold text-white">--</span>
        </div>
        <div class="mt-2">
            <span class="text-sm text-gray-400 uppercase tracking-wider">Instructions</span>
            <p id="detail-instructions" class="text-sm text-gray-200 mt-1">Select a route to see details.</p>
        </div>

        <button id="start-nav-btn" class="w-full mt-4 bg-gradient-to-r from-green-400 to-emerald-600 text-white font-bold py-3 rounded-lg hover:opacity-90 transition shadow-[0_0_15px_rgba(52,211,153,0.5)] hidden">
            Start Navigation
        </button>
        <button id="end-nav-btn" class="w-full mt-4 bg-gradient-to-r from-red-500 to-rose-700 text-white font-bold py-3 rounded-lg hover:opacity-90 transition shadow-[0_0_15px_rgba(225,29,72,0.5)] hidden">
            End Navigation
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
